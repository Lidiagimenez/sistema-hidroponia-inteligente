{% extends "layouts/base.html" %}

{% block title %}Alertas — HidroSensor{% endblock %}

{% block content %}

<!-- ==================== HEADER ==================== -->
<div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center">
            <i data-lucide="bell" class="w-6 h-6 text-red-600"></i>
        </div>
        <div>
            <h1 class="font-serif text-3xl font-bold text-gray-900">Alertas</h1>
            <p class="text-sm text-gray-600">Eventos y situaciones que requieren atención</p>
        </div>
    </div>
</div>

<!-- ==================== TABS + FILTROS ==================== -->
<div class="bg-white rounded-2xl border border-gray-200 p-4 mb-6">

    <!-- Tabs -->
    <div class="flex items-center gap-2 mb-4 overflow-x-auto">
        <button class="tab-btn active px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap" data-tab="todas">
            Todas (<span id="tab-todas-count">0</span>)
        </button>
        <button class="tab-btn px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap" data-tab="criticas">
            Críticas (<span id="tab-criticas-count">0</span>)
        </button>
        <button class="tab-btn px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap" data-tab="advertencias">
            Advertencias (<span id="tab-advertencias-count">0</span>)
        </button>
        <button class="tab-btn px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap" data-tab="informativas">
            Informativas (<span id="tab-info-count">0</span>)
        </button>
        <button class="tab-btn px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap" data-tab="resueltas">
            Resueltas (<span id="tab-resueltas-count">0</span>)
        </button>
    </div>

    <!-- Filtros -->
    <div class="flex flex-wrap items-center gap-3">
        <select class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand focus:border-brand outline-none">
            <option>Todos los cultivos</option>
        </select>
        <select class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand focus:border-brand outline-none">
            <option>Todos los tipos</option>
        </select>
        <select class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand focus:border-brand outline-none">
            <option>Todos los estados</option>
        </select>
        <div class="flex-1 min-w-[200px] relative">
            <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input type="text" placeholder="Buscar alertas..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand focus:border-brand outline-none">
        </div>
    </div>

</div>

<!-- ==================== CONTENIDO ==================== -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- LISTA DINÁMICA -->
    <div class="lg:col-span-2 space-y-3" id="lista-alertas">
        <div class="text-center py-8 text-gray-400 text-sm">
            <i data-lucide="loader" class="w-6 h-6 mx-auto mb-2 animate-spin"></i>
            Cargando alertas...
        </div>
    </div>

    <!-- PANEL DETALLE DINÁMICO -->
    <div class="lg:col-span-1">
        <div id="detalle-alerta" class="bg-white rounded-2xl border border-gray-200 p-5 sticky top-24">
            <div class="text-center py-8 text-gray-400 text-sm">
                <i data-lucide="loader" class="w-6 h-6 mx-auto mb-2 animate-spin"></i>
                Cargando...
            </div>
        </div>
    </div>

</div>

{% endblock %}


{% block extra_js %}
<script src="/static/js/api.js"></script>
<script src="/static/js/alertas.js"></script>
{% endblock %}
