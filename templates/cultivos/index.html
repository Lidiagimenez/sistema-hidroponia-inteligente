{% extends "layouts/base.html" %}

{% block title %}Cultivos — HidroSensor{% endblock %}

{% block content %}

<!-- HEADER -->
<div class="flex items-center justify-between mb-6 gap-4 flex-wrap">
    <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center">
            <i data-lucide="leaf" class="w-6 h-6 text-brand"></i>
        </div>
        <div>
            <h1 class="font-serif text-3xl font-bold text-gray-900">Cultivos</h1>
            <p class="text-sm text-gray-600">Gestiona y supervisa todos tus cultivos</p>
        </div>
    </div>

    <button id="btn-nuevo-cultivo" class="flex items-center gap-2 bg-brand hover:bg-brand-dark text-white text-sm font-semibold px-4 py-2.5 rounded-xl transition shadow-lg shadow-brand/20">
        <i data-lucide="plus" class="w-4 h-4"></i>
        Nuevo cultivo
    </button>
</div>

<!-- CONTENIDO -->
<div class="grid grid-cols-1 lg:grid-cols-5 gap-6">

    <div class="lg:col-span-2">
        <div class="bg-white rounded-2xl border border-gray-200 p-4 mb-4">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text" placeholder="Buscar cultivo..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand focus:border-brand outline-none">
            </div>
        </div>

        <div id="lista-cultivos" class="space-y-3">
            <div class="text-center py-8 text-gray-400 text-sm">
                <i data-lucide="loader" class="w-6 h-6 mx-auto mb-2 animate-spin"></i>
                Cargando cultivos...
            </div>
        </div>

        <p id="contador-cultivos" class="text-xs text-gray-500 text-center mt-4"></p>
    </div>

    <div id="detalle-contenido" class="lg:col-span-3">
        <div class="bg-white rounded-2xl border border-gray-200 p-10 text-center">
            <i data-lucide="loader" class="w-8 h-8 text-gray-300 mx-auto mb-3 animate-spin"></i>
            <p class="text-sm text-gray-500">Cargando...</p>
        </div>
    </div>

</div>

<!-- ==================== MODAL CULTIVO ==================== -->
<div id="modal-nuevo-cultivo" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">

    <div class="bg-white rounded-2xl max-w-md w-full p-6">

        <div class="flex items-center justify-between mb-5">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-brand-light rounded-xl flex items-center justify-center">
                    <i data-lucide="leaf" class="w-5 h-5 text-brand"></i>
                </div>
                <h2 id="modal-titulo-cultivo" class="font-serif text-xl font-bold text-gray-900">Nuevo cultivo</h2>
            </div>
            <button id="btn-cerrar-modal-cultivo" class="p-1 hover:bg-gray-100 rounded transition">
                <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
            </button>
        </div>

        <form id="form-nuevo-cultivo" class="space-y-4">

            <!-- Campo oculto para el ID cuando editamos -->
            <input type="hidden" id="cultivo-id-editar" value="">

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                    Nombre <span class="text-red-500">*</span>
                </label>
                <input
                    type="text"
                    id="input-nombre-cultivo"
                    required
                    placeholder="Ej: Lechuga francesa"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand focus:border-brand outline-none"
                >
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                    Tipo de cultivo
                </label>
                <input
                    type="text"
                    id="input-tipo-cultivo"
                    placeholder="Ej: Hortaliza, Hierba, Frutal..."
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand focus:border-brand outline-none"
                >
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                    Fecha de siembra <span class="text-red-500">*</span>
                </label>
                <input
                    type="date"
                    id="input-fecha-cultivo"
                    required
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand focus:border-brand outline-none"
                >
            </div>

            <div id="error-cultivo" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs px-3 py-2 rounded-lg"></div>

            <div class="flex gap-2 pt-2">
                <button type="button" onclick="cerrarModalCultivo()" class="flex-1 border border-gray-300 hover:border-gray-400 text-gray-700 font-semibold py-2.5 rounded-xl text-sm transition">
                    Cancelar
                </button>
                <button type="submit" id="btn-crear-cultivo" class="flex-1 bg-brand hover:bg-brand-dark text-white font-semibold py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    Crear cultivo
                </button>
            </div>

        </form>

    </div>

</div>

{% endblock %}


{% block extra_js %}
<script src="/static/js/api.js"></script>
<script src="/static/js/cultivos.js"></script>
{% endblock %}
